        - text: / Volební leták není reklamou
      - paragraph [ref=f9e37]: 14. 9. 2026 · Aktuality · 3 min čtení
      - heading "Volební leták není reklamou" [level=1] [ref=f9e38]
      - generic [ref=f9e39]:
        - paragraph [ref=f9e40]: Česká pošta doručuje volební letáky v rámci zákonných povinností. Nejde o reklamní zásilku, proto se na ni nevztahuje zákaz vhazování reklamy do schránek označených „reklamu nechci“.
        - paragraph [ref=f9e41]: Volební materiály se doručují podle pokynů zadavatele a volebního kalendáře. Pokud leták nedorazil, ověřte přístupnost schránky a jmenovku.
        - paragraph [ref=f9e42]: Dotazy k obsahu směřujte na zadavatele. Pošta odpovídá za doručení, nikoli za politický obsah.
